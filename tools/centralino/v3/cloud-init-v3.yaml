#cloud-config
# Centralino Giornale Lavori v3 (11/10/2026): Kamailio + rtpengine + assistente nostro (gl-voce).
# Configurazioni e programma arrivano ogni minuto dal relay (/centralino/pacchetto): dopo questo avvio
# ogni modifica si pubblica dal repository, senza ricreare il server.
package_update: true
packages:
- kamailio
- kamailio-tls-modules
- certbot
- python3
- python3-websockets
- libopus0
write_files:
- path: /etc/gl/centralino.json
  permissions: '0600'
  content: |
    {"token": "__TOKEN__", "relay": "__RELAY__"}
- path: /etc/kamailio/tls.cfg
  content: |
    [server:default]
    method = TLSv1.2+
    verify_certificate = no
    require_certificate = no
    private_key = /etc/kamailio/tls/privkey.pem
    certificate = /etc/kamailio/tls/fullchain.pem

    [client:default]
    method = TLSv1.2+
    verify_certificate = no
    require_certificate = no
- path: /usr/local/bin/gl-log.py
  permissions: '0755'
  content: |
    #!/usr/bin/env python3
    import json, subprocess, sys, urllib.request
    URL = "https://rvigugiufrjmzedjstuz.supabase.co/rest/v1/rpc/centralino_log"
    ANON = "__ANON__"
    TOKEN = "__TOKEN__"
    def invia(testo):
        if not testo.strip(): return
        req = urllib.request.Request(URL, data=json.dumps({"p_token": TOKEN, "p_testo": testo[:1990]}).encode(),
            headers={"apikey": ANON, "Authorization": "Bearer " + ANON, "Content-Type": "application/json"})
        try: urllib.request.urlopen(req, timeout=10)
        except Exception as e: print(e)
    if len(sys.argv) > 1:
        invia(" ".join(sys.argv[1:])); sys.exit(0)
    out = subprocess.run(["journalctl", "-u", "kamailio", "-u", "rtpengine-daemon", "-u", "gl-voce", "--since", "-65 seconds", "-o", "cat", "--no-pager"],
                         capture_output=True, text=True).stdout
    righe = [r for r in out.splitlines() if r.strip()]
    blocco = ""
    for r in righe:
        if len(blocco) + len(r) > 1900:
            invia(blocco); blocco = ""
        blocco += r + "\n"
    invia(blocco)
- path: /etc/systemd/system/gl-log.service
  content: |
    [Unit]
    Description=Invio registro centralino
    [Service]
    Type=oneshot
    ExecStart=/usr/local/bin/gl-log.py
- path: /etc/systemd/system/gl-log.timer
  content: |
    [Unit]
    Description=Invio registro centralino ogni minuto
    [Timer]
    OnBootSec=60
    OnUnitActiveSec=60
    [Install]
    WantedBy=timers.target
- path: /usr/local/bin/gl-cert-copia.sh
  permissions: '0755'
  content: |
    #!/bin/bash
    mkdir -p /etc/kamailio/tls
    cp -L /etc/letsencrypt/live/sip.ilgiornalelavori.it/fullchain.pem /etc/kamailio/tls/fullchain.pem
    cp -L /etc/letsencrypt/live/sip.ilgiornalelavori.it/privkey.pem /etc/kamailio/tls/privkey.pem
    chown -R kamailio:kamailio /etc/kamailio/tls && chmod 600 /etc/kamailio/tls/*.pem
    systemctl restart kamailio
- path: /usr/local/bin/gl-sync.py
  permissions: '0755'
  content: |
    #!/usr/bin/env python3
    # Centralino v3: ogni minuto scarica dal relay Kamailio, rtpengine e il programma dell'assistente (gl-voce).
    import fcntl, hashlib, json, os, re, subprocess, urllib.request
    CONF = json.load(open("/etc/gl/centralino.json"))
    URL = CONF["relay"].rstrip("/") + "/centralino/pacchetto"
    TOKEN = CONF["token"]
    LOG = "/usr/local/bin/gl-log.py"
    STATO = "/var/lib/gl"
    VOCE = "/opt/gl-voce"
    os.makedirs(STATO, exist_ok=True)
    blocco = open(STATO + "/sync.lock", "w")
    try:
        fcntl.flock(blocco, fcntl.LOCK_EX | fcntl.LOCK_NB)
    except OSError:
        raise SystemExit(0)  # un'altra sincronizzazione e' in corso
    def log(chiave, testo):
        f = STATO + "/ultimo-" + chiave
        prima = open(f).read() if os.path.exists(f) else ""
        if testo != prima:
            open(f, "w").write(testo)
            subprocess.run([LOG, testo])
    def attivo(unita):
        return subprocess.run(["systemctl", "is-active", unita], capture_output=True, text=True).stdout.strip()
    def leggi(p):
        return open(p).read() if os.path.exists(p) else ""
    def scrivi(p, testo, modo):
        open(p + ".nuovo", "w").write(testo)
        os.chmod(p + ".nuovo", modo)
        os.replace(p + ".nuovo", p)
    if not os.path.exists("/etc/kamailio/tls/fullchain.pem"):
        raise SystemExit(0)  # certificato non ancora pronto: ci pensa gl-avvio.sh
    try:
        ip = urllib.request.urlopen("http://169.254.169.254/hetzner/v1/metadata/public-ipv4", timeout=5).read().decode().strip()
    except Exception:
        raise SystemExit(0)
    try:
        req = urllib.request.Request(URL, headers={"X-GL-Centralino": TOKEN, "User-Agent": "gl-sync/3"})
        pac = json.loads(urllib.request.urlopen(req, timeout=20).read().decode())
        log("relay", "relay raggiungibile: " + str(pac.get("versione")) + " modo " + str(pac.get("modo")))
    except Exception as e:
        log("relay", "relay NON raggiungibile: " + str(e)[:200])
        raise SystemExit(0)
    # 1) rtpengine
    riavviato = False
    rtp = pac.get("rtpengine_conf")
    if isinstance(rtp, str) and "[rtpengine]" in rtp:
        rtp = rtp.replace("__IP__", ip)
        p = "/etc/rtpengine/rtpengine.conf"
        if rtp != leggi(p):
            os.makedirs("/etc/rtpengine", exist_ok=True)
            scrivi(p, rtp, 0o644)
            subprocess.run(["systemctl", "restart", "rtpengine-daemon"])
            riavviato = True
            log("rtpengine", "rtpengine: configurazione applicata, servizio " + attivo("rtpengine-daemon"))
    if not riavviato and attivo("rtpengine-daemon") != "active":
        subprocess.run(["systemctl", "restart", "rtpengine-daemon"])
        log("rtpengine", "rtpengine: era fermo, riavviato: " + attivo("rtpengine-daemon"))
    # 2) Kamailio (verificato con kamailio -c prima di applicarlo)
    riavviato = False
    cfg = pac.get("kamailio_cfg")
    if isinstance(cfg, str) and "#!KAMAILIO" in cfg:
        cfg = cfg.replace("__IP__", ip)
        p = "/etc/kamailio/kamailio.cfg"
        impronta = hashlib.sha256(cfg.encode()).hexdigest()
        if cfg != leggi(p) and impronta != leggi(STATO + "/scartata"):
            open(p + ".nuovo", "w").write(cfg)
            chk = subprocess.run(["kamailio", "-c", "-f", p + ".nuovo"], capture_output=True, text=True)
            if chk.returncode != 0:
                open(STATO + "/scartata", "w").write(impronta)
                log("kamailio", "kamailio: configurazione NON applicata (resta la precedente), errore: " + (chk.stderr or chk.stdout)[-1500:])
            else:
                os.replace(p + ".nuovo", p)
                subprocess.run(["systemctl", "restart", "kamailio"])
                riavviato = True
                log("kamailio", "kamailio: configurazione applicata (" + str(pac.get("modo")) + "), servizio " + attivo("kamailio"))
    if not riavviato and attivo("kamailio") != "active":
        subprocess.run(["systemctl", "restart", "kamailio"])
        log("kamailio", "kamailio: era fermo, riavviato: " + attivo("kamailio"))
    # 3) assistente gl-voce: si riavvia solo senza chiamate in corso
    cambiati = []
    for f in pac.get("file") or []:
        nome = str(f.get("nome", ""))
        testo = f.get("contenuto") or ""
        if not re.fullmatch(r"[a-z0-9_\-]+\.py", nome) or not testo:
            continue
        p = VOCE + "/" + nome
        if testo != leggi(p):
            os.makedirs(VOCE, exist_ok=True)
            scrivi(p, testo, 0o644)
            cambiati.append(nome + " " + hashlib.sha256(testo.encode()).hexdigest()[:12])
    if cambiati:
        open(STATO + "/voce-da-riavviare", "w").write(", ".join(cambiati))
    if os.path.exists(VOCE + "/gl_voce.py"):
        attive = (leggi("/run/gl-voce/attive").strip() or "0")
        if os.path.exists(STATO + "/voce-da-riavviare"):
            if attive == "0" or attivo("gl-voce") != "active":
                quali = leggi(STATO + "/voce-da-riavviare")
                subprocess.run(["systemctl", "enable", "gl-voce"], capture_output=True)
                subprocess.run(["systemctl", "restart", "gl-voce"])
                os.remove(STATO + "/voce-da-riavviare")
                log("voce", "assistente aggiornato (" + quali + "), servizio " + attivo("gl-voce"))
            else:
                log("voce", "assistente aggiornato: riavvio rimandato, chiamate in corso " + attive)
        elif attivo("gl-voce") != "active":
            subprocess.run(["systemctl", "enable", "gl-voce"], capture_output=True)
            subprocess.run(["systemctl", "restart", "gl-voce"])
            log("voce", "assistente era fermo, riavviato: " + attivo("gl-voce"))
- path: /etc/systemd/system/gl-sync.service
  content: |
    [Unit]
    Description=Sincronizza centralino dal relay
    [Service]
    Type=oneshot
    ExecStart=/usr/local/bin/gl-sync.py
- path: /etc/systemd/system/gl-sync.timer
  content: |
    [Unit]
    Description=Sincronizza centralino ogni minuto
    [Timer]
    OnBootSec=120
    OnUnitActiveSec=60
    [Install]
    WantedBy=timers.target
- path: /etc/systemd/system/gl-voce.service
  content: |
    [Unit]
    Description=Assistente vocale Giornale Lavori (gl-voce)
    After=network-online.target
    Wants=network-online.target
    [Service]
    User=glvoce
    Group=glvoce
    ExecStart=/usr/bin/python3 /opt/gl-voce/gl_voce.py
    Restart=always
    RestartSec=3
    RuntimeDirectory=gl-voce
    RuntimeDirectoryPreserve=yes
    NoNewPrivileges=yes
    ProtectSystem=strict
    ProtectHome=yes
    PrivateTmp=yes
    [Install]
    WantedBy=multi-user.target
- path: /usr/local/bin/gl-avvio.sh
  permissions: '0755'
  content: |
    #!/bin/bash
    IP=$(curl -s http://169.254.169.254/hetzner/v1/metadata/public-ipv4)
    V() { dpkg-query -W -f='${Version}' "$1" 2>/dev/null || echo NON-INSTALLATO; }
    /usr/local/bin/gl-log.py "avvio server $IP (centralino v3: Kamailio + rtpengine $(V rtpengine-daemon) + assistente gl-voce, websockets $(V python3-websockets), opus $(V libopus0)): in attesa del DNS di sip.ilgiornalelavori.it"
    for i in $(seq 1 240); do
      R=$(getent ahostsv4 sip.ilgiornalelavori.it | awk '{print $1; exit}')
      [ "$R" = "$IP" ] && break
      sleep 30
    done
    if [ ! -f /etc/letsencrypt/live/sip.ilgiornalelavori.it/fullchain.pem ]; then
      certbot certonly --standalone --non-interactive --agree-tos --register-unsafely-without-email \
        -d sip.ilgiornalelavori.it --deploy-hook /usr/local/bin/gl-cert-copia.sh >/var/log/gl-certbot.log 2>&1
      /usr/local/bin/gl-log.py "certificato: $(tail -n 3 /var/log/gl-certbot.log | tr '\n' ' ')"
    fi
    /usr/local/bin/gl-cert-copia.sh
    /usr/local/bin/gl-sync.py
    systemctl enable kamailio rtpengine-daemon
    sleep 3
    /usr/local/bin/gl-log.py "stato: kamailio $(systemctl is-active kamailio) · rtpengine $(systemctl is-active rtpengine-daemon) · assistente $(systemctl is-active gl-voce) · $(journalctl -u kamailio -u rtpengine-daemon -u gl-voce -n 10 -o cat --no-pager | tr '\n' ' ' | cut -c1-1400)"
    sleep 5
    runuser -u glvoce -- /usr/bin/python3 /opt/gl-voce/gl_voce.py --prova >/var/log/gl-voce-prova.log 2>&1
    /usr/local/bin/gl-log.py "prova assistente: $(tail -n 12 /var/log/gl-voce-prova.log | tr '\n' ' ' | cut -c1-1700)"
runcmd:
- sed -i 's/^#\?RUN_KAMAILIO=.*/RUN_KAMAILIO=yes/' /etc/default/kamailio || true
- DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends rtpengine-daemon > /var/log/gl-rtpengine-install.log 2>&1 || true
- sed -i 's/^MANAGE_IPTABLES=.*/MANAGE_IPTABLES=no/' /etc/default/rtpengine-daemon || true
- systemctl disable --now rtpengine-recording-daemon rtpengine-recording-nfs-mount || true
- useradd --system --no-create-home --shell /usr/sbin/nologin glvoce || true
- mkdir -p /opt/gl-voce /var/lib/gl
- chgrp glvoce /etc/gl/centralino.json && chmod 0640 /etc/gl/centralino.json
- systemctl daemon-reload
- systemctl enable --now gl-log.timer
- systemctl enable --now gl-sync.timer
- nohup /usr/local/bin/gl-avvio.sh >/var/log/gl-avvio.log 2>&1 &
